ase</text><text x="1000.0" y="793.0" text-anchor="middle" font-size="17" fill="#334155">new detector gets</text><text x="1000.0" y="818.0" text-anchor="middle" font-size="17" fill="#334155">5% of traffic first</text><rect x="1200" y="715" width="250" height="140" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.5"/><text x="1325.0" y="768.0" text-anchor="middle" font-size="21" font-weight="700" fill="#DC2626">CI eval gate</text><text x="1325.0" y="793.0" text-anchor="middle" font-size="17" fill="#334155">recall below 0.90</text><text x="1325.0" y="818.0" text-anchor="middle" font-size="17" fill="#334155">blocks the merge</text><polyline points="480.1,610 479.96,715" fill="none" stroke="#D97706" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#vis-async)"/><polyline points="750.0,610 749.96,715" fill="none" stroke="#D97706" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#vis-async)"/><polyline points="1065.0,610 1065,690 780,690 779.8399999999999,715" fill="none" stroke="#D97706" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#vis-async)"/><polyline points="800,785.0 860,785.0" fill="none" stroke="#DC2626" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#vis-control)"/><text x="830" y="775" text-anchor="middle" font-size="16" font-style="italic" fill="#DC2626" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">roll back</text><polyline points="1200,785.0 1140,785.0" fill="none" stroke="#DC2626" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#vis-control)"/><text x="1170" y="775" text-anchor="middle" font-size="16" font-style="italic" fill="#DC2626" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">passes</text><polyline points="1099.96,715 1100,678 1468,678 1468,298 1450,298.0" fill="none" stroke="#DC2626" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#vis-control)"/><text x="1290" y="672" text-anchor="middle" font-size="16" font-style="ita