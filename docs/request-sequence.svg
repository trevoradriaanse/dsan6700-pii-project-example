<svg class="ntk-fig" viewBox="0 0 1500 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two requests, and who holds the file" font-family="Inter, Helvetica, Arial, sans-serif"><defs><marker id="seq-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563EB"/></marker><marker id="seq-s-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563EB"/></marker><marker id="seq-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#D97706"/></marker><marker id="seq-s-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#D97706"/></marker><marker id="seq-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#DC2626"/></marker><marker id="seq-s-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#DC2626"/></marker><marker id="seq-planned" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7C3AED"/></marker><marker id="seq-s-planned" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7C3AED"/></marker><marker id="seq-feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#0F766E"/></marker><marker id="seq-s-feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#0F766E"/></marker></defs><rect width="1500" height="760" rx="16" fill="#FFFFFF"/><text x="24" y="40" font-size="28" font-weight="700" fill="#111827">Two requests, and who holds the file</text><text x="1308.0" y="38" font-size="15" fill="#334155">Feedback from people</text><line x1="1256.0" y1="33" x2="1298.0" y2="33" stroke="#0F766E" stroke-width="2.8" marker-end="url(#seq-feedback)"/><text x="1093.2" y="38" font-size="15" fill="#334155">Live request path</text><line x1="1041.2" y1="33" x2="1083.2" y2="33" stroke="#2563EB" stroke-width="2.8" marker-end="url(#seq-live)"/><rect x="20" y="62" width="1460" height="684" rx="14" fill="#F3F5F8"/><text x="38" y="90" font-size="15" font-weight="700" letter-spacing="2.5" fill="#5B6B80">ONE REDACTION, TOP TO BOTTOM IN TIME</text><line x1="170" y1="160" x2="170" y2="730" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 6"/><line x1="560" y1="160" x2="560" y2="730" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 6"/><line x1="950" y1="160" x2="950" y2="730" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 6"/><line x1="1320" y1="160" x2="1320" y2="730" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 6"/><rect x="515" y="350" width="90" height="190" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><rect x="50" y="100" width="240" height="60" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/><text x="170.0" y="137.0" text-anchor="middle" font-size="21" font-weight="700" fill="#92400E">Person</text><rect x="440" y="100" width="240" height="60" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="560.0" y="137.0" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">Browser</text><rect x="830" y="100" width="240" height="60" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="950.0" y="137.0" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">FastAPI</text><rect x="1200" y="100" width="240" height="60" rx="10" fill="#F0FDFA" stroke="#0F766E" stroke-width="2.5"/><text x="1320.0" y="137.0" text-anchor="middle" font-size="21" font-weight="700" fill="#0F766E">Detector</text><polyline points="176,205 554,205" fill="none" stroke="#0F766E" stroke-width="2.6" marker-end="url(#seq-feedback)"/><text x="365.0" y="196" text-anchor="middle" font-size="16" font-weight="400" fill="#0F766E" font-style="italic">choose a PDF</text><polyline points="566,250 944,250" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#seq-live)"/><text x="755.0" y="241" text-anchor="middle" font-size="16" font-weight="400" fill="#2563EB" font-style="italic">POST /api/detect  (the PDF)</text><polyline points="956,295 1314,295" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#seq-live)"/><text x="1135.0" y="286" text-anchor="middle" font-size="16" font-weight="400" fill="#2563EB" font-style="italic">detect(text)</text><polyline points="1314,335 956,335" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#seq-live)"/><text x="1135.0" y="326" text-anchor="middle" font-size="16" font-weight="400" fill="#2563EB" font-style="italic">spans</text><polyline points="944,380 566,380" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#seq-live)"/><text x="755.0" y="371" text-anchor="middle" font-size="16" font-weight="400" fill="#2563EB" font-style="italic">findings (the PDF is forgotten)</text><polyline points="554,425 176,425" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#seq-live)"/><text x="365.0" y="416" text-anchor="middle" font-size="16" font-weight="400" fill="#2563EB" font-style="italic">a table with checkboxes</text><polyline points="176,470 554,470" fill="none" stroke="#0F766E" stroke-width="2.6" marker-end="url(#seq-feedback)"/><text x="365.0" y="461" text-anchor="middle" font-size="16" font-weight="400" fill="#0F766E" font-style="italic">uncheck what to keep</text><polyline points="566,560 944,560" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#seq-live)"/><text x="755.0" y="551" text-anchor="middle" font-size="16" font-weight="400" fill="#2563EB" font-style="italic">POST /api/redact  (the same PDF + choices)</text><polyline points="950,596 1010,596 1010,626 950,626" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#seq-live)"/><text x="1025" y="616" text-anchor="start" font-size="16" font-weight="400" fill="#1E3A8A" font-style="italic">remove the text, then the leak check</text><polyline points="944,660 566,660" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#seq-live)"/><text x="755.0" y="651" text-anchor="middle" font-size="16" font-weight="400" fill="#2563EB" font-style="italic">a PDF with the text removed</text><polyline points="554,705 176,705" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#seq-live)"/><text x="365.0" y="696" text-anchor="middle" font-size="16" font-weight="400" fill="#2563EB" font-style="italic">download</text><text x="622" y="508" text-anchor="start" font-size="16" font-weight="700" fill="#92400E">Between the two requests, only the browser holds the file.</text><text x="622" y="530" text-anchor="start" font-size="15" font-weight="400" fill="#92400E">The server kept nothing, so it can be restarted, or scaled, at any time.</text></svg>