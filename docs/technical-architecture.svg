efs><rect width="1500" height="860" rx="16" fill="#FFFFFF"/><text x="24" y="40" font-size="28" font-weight="700" fill="#111827">Technical architecture, as deployed</text><text x="1308.0" y="38" font-size="15" fill="#334155">Changes and releases</text><line x1="1256.0" y1="33" x2="1298.0" y2="33" stroke="#DC2626" stroke-width="2.8" stroke-dasharray="9 6" marker-end="url(#tech-control)"/><text x="1009.2" y="38" font-size="15" fill="#334155">Measurement, after the fact</text><line x1="957.2" y1="33" x2="999.2" y2="33" stroke="#D97706" stroke-width="2.8" stroke-dasharray="9 6" marker-end="url(#tech-async)"/><text x="794.4000000000001" y="38" font-size="15" fill="#334155">Live request path</text><line x1="742.4000000000001" y1="33" x2="784.4000000000001" y2="33" stroke="#2563EB" stroke-width="2.8" marker-end="url(#tech-live)"/><rect x="20" y="62" width="1460" height="330" rx="14" fill="#EEF4FD"/><text x="38" y="90" font-size="15" font-weight="700" letter-spacing="2.5" fill="#5B6B80">LIVE REQUEST PATH</text><rect x="20" y="406" width="1460" height="200" rx="14" fill="#FDF5EC"/><text x="38" y="434" font-size="15" font-weight="700" letter-spacing="2.5" fill="#5B6B80">MEASUREMENT: OFFLINE, ON THE BENCHMARK</text><rect x="20" y="620" width="1460" height="225" rx="14" fill="#FCEFEF"/><text x="38" y="648" font-size="15" font-weight="700" letter-spacing="2.5" fill="#5B6B80">DELIVERY: FROM A PULL REQUEST TO THE INSTANCE</text><rect x="330" y="96" width="1120" height="280" rx="10" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 6"/><text x="344" y="118" font-size="15" fill="#64748B">Jetstream2 m3.medium, one Docker container (Compose), only port 8000 published</text><rect x="50" y="160" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="150.0" y="203.0" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">Browser</text><text x="150.0" y="228.0" text-anchor="middle" font-size="17" fill="#334155">the page, or</text><text x="150.0" y="253.0" text-anchor="middle" font-size="17" fill="#334155">curl and scripts</text><rect x="370" y="130" width="270" height="190" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="505.0" y="184.0" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">FastAPI</text><text x="505.0" y="209.0" text-anchor="middle" font-size="17" fill="#334155">GET / (the page)</text><text x="505.0" y="234.0" text-anchor="middle" font-size="17" fill="#334155">POST /api/detect</text><text x="505.0" y="259.0" text-anchor="middle" font-size="17" fill="#334155">POST /api/redact</text><text x="505.0" y="284.0" text-anchor="middle" font-size="17" fill="#334155">/health /ready /docs</text><rect x="730" y="130" width="300" height="100" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="880.0" y="163.0" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">PyMuPDF</text><text x="880.0" y="188.0" text-anchor="middle" font-size="17" fill="#334155">read text; remove it;</text><text x="880.0" y="213.0" text-anchor="middle" font-size="17" fill="#334155">leak check</text><rect x="730" y="250" width="300" height="90" rx="10" fill="#F0FDFA" stroke="#0F766E" stroke-width="2.5"/><text x="880.0" y="290.0" text-anchor="middle" font-size="21" font-weight="700" fill="#0F766E">Detector</text><text x="880.0" y="315.0" text-anchor="middle" font-size="17" fill="#334155">regex | gliner, by NTK_DETECTOR</text><rect x="1110" y="250" width="310" height="90" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="1265.0" y="290.0" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">Volume "models"</text><text x="1265.0" y="315.0" text-anchor="middle" font-size="17" fill="#334155">weights, downloaded once</text><rect x="1110" y="130" width="310" height="100" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.5"/><text x="1265.0" y="163.0" text-anchor="middle" font-size="21" font-weight="700" fill="#DC2626">Nothing on disk</text><text x="1265.0" y="188.0" text-anchor="middle" font-size="17" fill="#334155">PDF in memory, then gone;</text><text x="1265.0" y="213.0" text-anchor="middle" font-size="17" fill="#334155">logs record counts only</text><polyline points="250,202.0 370,202.01" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#tech-live)"/><text x="310" y="194" text-anchor="middle" font-size="16" font-style="italic" fill="#2563EB" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">PDF</text><polyline points="370,244.0 250,244.0" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#tech-live)"/><text x="310" y="270" text-anchor="middle" font-size="16" font-style="italic" fill="#2563EB" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">findings or PDF</text><polyline points="640,179.97 730,180.0" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#tech-live)"/><polyline points="820.0,230 820.0,250" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#tech-live)"/><text x="790" y="244" text-anchor="middle" font-size="16" font-style="italic" fill="#2563EB" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">text</text><polyline points="730,295.0 640,294.91999999999996" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#tech-live)"/><text x="685" y="287" text-anchor="middle" font-size="16" font-style="italic" fill="#2563EB" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">spans</text><polyline points="1110,295.0 1030,295.0" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#tech-live)"/><text x="1070" y="288" text-anchor="middle" font-size="16" font-style="italic" fill="#2563EB" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">at startup</text><rect x="60" y="460" width="260" height="110" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/