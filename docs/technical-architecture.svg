)"/><polyline points="790.0,340 790,400 596,400 596.0,460" fill="none" stroke="#D97706" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#tech-async)"/><text x="690" y="394" text-anchor="middle" font-size="16" font-style="italic" fill="#D97706" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">same code</text><rect x="60" y="690" width="230" height="120" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="175.0" y="733.0" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">Issue</text><text x="175.0" y="758.0" text-anchor="middle" font-size="17" fill="#334155">one task,</text><text x="175.0" y="783.0" text-anchor="middle" font-size="17" fill="#334155">one branch</text><rect x="360" y="690" width="250" height="120" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="485.0" y="733.0" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">Pull request</text><text x="485.0" y="758.0" text-anchor="middle" font-size="17" fill="#334155">reviewed by a</text><text x="485.0" y="783.0" text-anchor="middle" font-size="17" fill="#334155">teammate</text><rect x="680" y="690" width="250" height="120" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.5"/><text x="805.0" y="733.0" text-anchor="middle" font-size="21" font-weight="700" fill="#DC2626">CI</text><text x="805.0" y="758.0" text-anchor="middle" font-size="17" fill="#334155">ruff, pytest;</text><text x="805.0" y="783.0" text-anchor="middle" font-size="17" fill="#334155">red blocks merge</text><rect x="1000" y="690" width="180" height="120" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="1090.0" y="745.0" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">main</text><text x="1090.0" y="770.0" text-anchor="middle" font-size="17" fill="#334155">the truth</text><rect x="1240" y="690" width="210" height="120" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="1345.0" y="733.0" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">Deploy</text><text x="1345.0" y="758.0" text-anchor="middle" font-size="17" fill="#334155">git pull, then</text><text x="1345.0" y="783.0" text-anchor="middle" font-size="17" fill="#334155">compose up --build</text><polyline points="290,750.0 360,750.0" fill="none" stroke="#DC2626" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#tech-control)"/><polyline points="610,750.0 680,750.0" fill="none" stroke="#DC2626" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#tech-control)"/><polyline points="930,750.0 1000,750.0" fill="none" stroke="#DC2626" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#tech-control)"/><polyline points="1180,750.0 1240,750.0" fill="none" stroke="#DC2626" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#tech-control)"/><polyline points="1450,750.0 1468,750 1468,320 1450,320.0" fill="none" stroke="#DC2626" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#tech-control)"/><text x="1420" y="660" text-anchor="middle" font-size="16" font-style="italic" fill="#DC2626" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">new image</text></svg>