name: Release
# A release gives a version name to an image CI already built and tested from the same commit. Nothing is rebuilt:
#   git tag -a v0.3.0 -m v0.3.0 && git push origin v0.3.0      (after CI on that commit is green)
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the version in pyproject.toml
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME but pyproject.toml says $VERSION"; exit 1
          fi
      - name: Name the tested image by its version
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          SRC=ghcr.io/trevoradriaanse/needtoknow:sha-${GITHUB_SHA::7}
          DST=ghcr.io/trevoradriaanse/needtoknow:$GITHUB_REF_NAME
          if ! docker pull -q "$SRC"; then
            echo "::error::$SRC is not in the registry: wait for CI on this commit to finish, then re-run this job"; exit 1
          fi
          docker tag "$SRC" "$DST"
          docker push -q "$DST"
          # The same image under a second name. A digest is the hash of the manifest, so the two must match.
          A=sha256:$(docker buildx imagetools inspect --raw "$SRC" | sha256sum | cut -c1-64)
          B=sha256:$(docker buildx imagetools inspect --raw "$DST" | sha256sum | cut -c1-64)
          echo "$SRC is $A"; echo "$DST is $B"
          if [ "$A" != "$B" ]; then echo "::error::$DST is not the image CI tested"; exit 1; fi
          echo "\`$DST\` is \`$SRC\`, digest $B" >> "$GITHUB_STEP_SUMMARY"
      - name: Release notes, from CHANGELOG.md
        run: |
          awk -v v="[${GITHUB_REF_NAME#v}]" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md | tee -a "$GITHUB_STEP_SUMMARY"
