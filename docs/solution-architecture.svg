eight="850" rx="16" fill="#FFFFFF"/><text x="24" y="40" font-size="28" font-weight="700" fill="#111827">Solution architecture</text><text x="1291.2" y="38" font-size="15" fill="#334155">Planned, not built yet</text><line x1="1239.2" y1="33" x2="1281.2" y2="33" stroke="#7C3AED" stroke-width="2.8" stroke-dasharray="3 5" marker-end="url(#sol-planned)"/><text x="1051.2" y="38" font-size="15" fill="#334155">Changes and releases</text><line x1="999.2" y1="33" x2="1041.2" y2="33" stroke="#DC2626" stroke-width="2.8" stroke-dasharray="9 6" marker-end="url(#sol-control)"/><text x="752.4000000000001" y="38" font-size="15" fill="#334155">Measurement, after the fact</text><line x1="700.4000000000001" y1="33" x2="742.4000000000001" y2="33" stroke="#D97706" stroke-width="2.8" stroke-dasharray="9 6" marker-end="url(#sol-async)"/><text x="537.6000000000001" y="38" font-size="15" fill="#334155">Live request path</text><line x1="485.60000000000014" y1="33" x2="527.6000000000001" y2="33" stroke="#2563EB" stroke-width="2.8" marker-end="url(#sol-live)"/><rect x="20" y="62" width="1460" height="220" rx="14" fill="#EEF4FD"/><text x="38" y="90" font-size="15" font-weight="700" letter-spacing="2.5" fill="#5B6B80">USE: WHAT A PERSON DOES, ONCE</text><rect x="20" y="296" width="1460" height="170" rx="14" fill="#FCEFEF"/><text x="38" y="324" font-size="15" font-weight="700" letter-spacing="2.5" fill="#5B6B80">MONITOR: WHAT WE WATCH, NEVER THE TEXT</text><rect x="20" y="480" width="1460" height="220" rx="14" fill="#FDF5EC"/><text x="38" y="508" font-size="15" font-weight="700" letter-spacing="2.5" fill="#5B6B80">BUILD: HOW WE MAKE IT, AND KNOW IT WORKS</text><rect x="20" y="714" width="1460" height="120" rx="14" fill="#F3F5F8"/><text x="38" y="742" font-size="15" font-weight="700" letter-spacing="2.5" fill="#5B6B80">STATE: WHAT PERSISTS</text><rect x="60" y="130" width="230" height="110" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="175.0" y="168.0" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">Upload</text><text x="175.0" y="193.0" text-anchor="middle" font-size="17" fill="#334155">one PDF, up to</text><text x="175.0" y="218.0" text-anchor="middle" font-size="17" fill="#334155">30 pages</text><rect x="345" y="130" width="230" height="110" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="460.0" y="168.0" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">Review</text><text x="460.0" y="193.0" text-anchor="middle" font-size="17" fill="#334155">a table of what</text><text x="460.0" y="218.0" text-anchor="middle" font-size="17" fill="#334155">was found</text><rect x="630" y="130" width="230" height="110" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/><text x="745.0" y="168.0" text-anchor="middle" font-size="21" font-weight="700" fill="#92400E">Uncheck</text><text x="745.0" y="193.0" text-anchor="middle" font-size="17" fill="#334155">keep what the</text><text x="745.0" y="218.0" text-anchor="middle" font-size="17" fill="#334155">reader needs</text><rect x="915" y="130" width="230" height="110" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="1030.0" y="168.0" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">Download</text><text x="1030.0" y="193.0" text-anchor="middle" font-size="17" fill="#334155">a copy with the</text><text x="1030.0" y="218.0" text-anchor="middle" font-size="17" fill="#334155">text removed</text><rect x="1200" y="130" width="230" height="110" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/><text x="1315.0" y="168.0" text-anchor="middle" font-size="21" font-weight="700" fill="#92400E">Check</text><text x="1315.0" y="193.0" text-anchor="middle" font-size="17" fill="#334155">select the black</text><text x="1315.0" y="218.0" text-anchor="middle" font-size="17" fill="#334155">box: nothing there</text><polyline points="290,185.0 345,185.0" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#sol-live)"/><polyline points="575,185.0 630,185.0" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#sol-live)"/><polyline points="860,185.0 915,185.0" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#sol-live)"/><polyline points="1145,185.0 1200,185.0" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#sol-live)"/><rect x="60" y="346" width="300" height="100" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="210.0" y="391.0" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">Counts and seconds</text><text x="210.0" y="416.0" text-anchor="middle" font-size="17" fill="#334155">documents, pages, time</text><rect x="420" y="346" width="300" height="100" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="570.0" y="391.0" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">Findings per page</text><text x="570.0" y="416.0" text-anchor="middle" font-size="17" fill="#334155">how many, of which type</text><rect x="780" y="346" width="300" height="100" rx="10" fill="#FAF5FF" stroke="#7C3AED" stroke-width="2" stroke-dasharray="4 5"/><text x="930.0" y="391.0" text-anchor="middle" font-size="21" font-weight="700" fill="#7C3AED">Unchecked rate</text><text x="930.0" y="416.0" text-anchor="middle" font-size="17" fill="#334155">how often people disagree</text><rect x="1140" y="346" width="300" height="100" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="1290.0" y="391.0" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">One dashboard</text><text x="1290.0" y="416.0" text-anchor="middle" font-size="17" fill="#334155">for the team, not the user</text><polyline points="360,396.0 420,396.0" fill="none" stroke="#D97706" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#sol-async)"/><polyline points="720,396.0 780,396.0" fill="none" stroke="#D97706" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#sol-async)"/><polyline points=