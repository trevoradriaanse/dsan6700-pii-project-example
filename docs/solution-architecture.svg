middle" font-size="17" fill="#334155">by type</text><rect x="915" y="540" width="230" height="110" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="1030.0" y="578.0" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">Error analysis</text><text x="1030.0" y="603.0" text-anchor="middle" font-size="17" fill="#334155">read what it</text><text x="1030.0" y="628.0" text-anchor="middle" font-size="17" fill="#334155">gets wrong</text><rect x="1200" y="540" width="240" height="110" rx="10" fill="#F0FDFA" stroke="#0F766E" stroke-width="2.5"/><text x="1320.0" y="578.0" text-anchor="middle" font-size="21" font-weight="700" fill="#0F766E">Better detector</text><text x="1320.0" y="603.0" text-anchor="middle" font-size="17" fill="#334155">a model for names,</text><text x="1320.0" y="628.0" text-anchor="middle" font-size="17" fill="#334155">chosen by a setting</text><polyline points="290,595.0 345,595.0" fill="none" stroke="#D97706" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#sol-async)"/><polyline points="575,595.0 630,595.0" fill="none" stroke="#D97706" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#sol-async)"/><polyline points="860,595.0 915,595.0" fill="none" stroke="#D97706" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#sol-async)"/><polyline points="1145,595.0 1200,595.0" fill="none" stroke="#D97706" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#sol-async)"/><polyline points="1440,595.0 1468,595 1468,100 460,100 460.0,130" fill="none" stroke="#DC2626" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#sol-control)"/><text x="1000" y="94" text-anchor="middle" font-size="16" font-style="italic" fill="#DC2626" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">ship it: a setting and a rebuild</text><polyline points="1272.0,650 1272,685 745,685 745.0,650" fill="none" stroke="#D97706" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#sol-async)"/><text x="1000" y="679" text-anchor="middle" font-size="16" font-style="italic" fill="#D97706" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">measure again</text><rect x="60" y="752" width="320" height="66" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="220.0" y="780.0" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">Documents</text><text x="220.0" y="805.0" text-anchor="middle" font-size="17" fill="#334155">none kept, ever</text><rect x="415" y="752" width="320" height="66" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="575.0" y="780.0" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">Model weights</text><text x="575.0" y="805.0" text-anchor="middle" font-size="17" fill="#334155">a cache volume</text><rect x="770" y="752" width="320" height="66" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="930.0" y="780.0" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">Configuration</text><text x="930.0" y="805.0" text-anchor="middle" font-size="17" fill="#334155">.env, at run time</text><rect x="1125" y="752" width="320" height="66" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="1285.0" y="780.0" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">Code and decisions</text><text x="1285.0" y="805.0" text-anchor="middle" font-size="17" fill="#334155">GitHub: issues, PRs, CI</text></svg>