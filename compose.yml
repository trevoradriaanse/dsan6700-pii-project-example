# Every service's log lines, kept in at most three files of 10 MB: Docker keeps them all by default, and JSON logs under
# load fill a disk quickly.
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  app:
    build:
      context: .
      args:
        DETECTOR_EXTRA: ${DETECTOR_EXTRA:-}   # empty for the regex baseline; "gliner" or "presidio" for a model
    # On the instance, .env pins APP_IMAGE to an image CI built and pushed (deploy = pull + up). Unset, Compose builds
    # locally as before: `docker compose up -d --build`.
    image: ${APP_IMAGE:-needtoknow:${DETECTOR_EXTRA:-regex}}
    env_file: .env
    ports:
      # APP_BIND=127.0.0.1 once Caddy is the way in: then only this machine reaches the app's port.
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8000}:8000"
    volumes:
      - models:/home/app/.cache/huggingface   # model weights survive a rebuild or restart
      - data:/data                            # the usage counts (and their backups) survive a deploy
    tmpfs:
      - /tmp                                  # a large upload is spooled here: keep it in memory, never on disk
    restart: unless-stopped
    logging: *logging

  # Grafana, Prometheus (metrics), Tempo (traces), Loki (logs) and an OpenTelemetry collector in one container: made
  # for development and demonstrations, not production. On only when .env says COMPOSE_PROFILES=observability (or
  # proxy,observability); set OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318 there too, so the app sends it its traces
  # and log lines. Prometheus collects the app's /metrics itself.
  lgtm:
    image: grafana/otel-lgtm:0.39.0@sha256:4c8056c9c05fcb3c8fd93800e85334bfd79b4d0271b47a54a121a64af41fe1fe
    profiles: [observability]
    ports:
      - "127.0.0.1:3000:3000"                 # Grafana, for this machine only: open it through an SSH tunnel
    volumes:
      - ./observability/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./observability/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/needtoknow.yaml:ro
      - ./observability/dashboards:/otel-lgtm/needtoknow-dashboards:ro
      - ./observability/alerts.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/needtoknow.yaml:ro
    restart: unless-stopped
    logging: *logging

  # Our front door, on only when .env says COMPOSE_PROFILES=proxy: it answers at NTK_DOMAIN on ports 80 and 443, gets
  # the HTTPS certificate on its own, and passes each request to the app.
  caddy:
    image: caddy:2.11.7@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    profiles: [proxy]
    ports:
      - "80:80"
      - "443:443"
    environment:
      NTK_DOMAIN: ${NTK_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data                           # its certificates survive a restart
    restart: unless-stopped
    logging: *logging

volumes:
  models:
  data:
  caddy:
