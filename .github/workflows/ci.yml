name: CI
on:
  push:
    branches: [main, example-l8]
  pull_request:
  workflow_dispatch:                  # a "Run workflow" button on the Actions tab

# The token every job gets can only read the repository. A job that needs more asks for it (publish, below).
permissions:
  contents: read

# One run at a time per branch or pull request. A newer push to a pull request cancels the older run; on a branch
# a run always finishes, so an image is never half-published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]      # the version in the image, and the next one
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true          # keep downloaded packages between runs, keyed on uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests
      - run: uv run pytest -q

  # Continuous delivery: after the tests pass on a push (not a pull request), build the image once, check that it
  # starts, and push it to ghcr.io named by its commit. Deploying it is a separate, human step: scripts/deploy.sh.
  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build, tagged by commit
        run: |
          echo "IMAGE=ghcr.io/trevoradriaanse/needtoknow:sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          docker build --build-arg GIT_SHA=${GITHUB_SHA::7} \
            -t ghcr.io/trevoradriaanse/needtoknow:sha-${GITHUB_SHA::7} .
      - name: Smoke test the image before pushing it
        run: |
          docker run --rm -v smoke-data:/data $IMAGE python -m needtoknow.migrate up
          docker run -d --name smoke -p 8000:8000 -v smoke-data:/data $IMAGE
          for i in $(seq 1 30); do curl -sf localhost:8000/ready && break; sleep 2; done
          curl -sf localhost:8000/ready | grep -q "\"commit\":\"${GITHUB_SHA::7}\""
          bash scripts/smoke.sh 8000
      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push $IMAGE
          DIGEST=$(docker image inspect -f '{{index .RepoDigests 0}}' $IMAGE)
          echo "Pushed \`$IMAGE\`, which is \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
